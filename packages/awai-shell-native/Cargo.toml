[package]
name = "awai-shell-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
[dependencies]
awai-peer-runtime = { path = "../awai-peer" }
tauri = { version = "=3.0.0-alpha.6", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
futures = "0.3"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread"] }
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
