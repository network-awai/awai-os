# Heartbeat written by each reaper run (lastRun, result, error, pools, deleted).
# The coordinator health check reads it; a stale lastRun (> 20 min) means the
# reaper is broken. CronJob .status.lastSuccessfulTime is a second signal.
apiVersion: v1
kind: ConfigMap
metadata:
  name: build-reaper-heartbeat
  namespace: build-reaper
data:
  lastRun: never
  result: pending
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: build-reaper-heartbeat
  namespace: build-reaper
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["build-reaper-heartbeat"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: build-reaper-heartbeat
  namespace: build-reaper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: build-reaper-heartbeat
subjects:
  - kind: ServiceAccount
    name: build-reaper
    namespace: build-reaper
