# No ingress. Egress only to DNS, the Kubernetes API and HTTPS (Vultr API).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: build-reaper
  namespace: build-reaper
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
  egress:
    - ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 6443 }
