<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shirohan 白版</title>
  <link rel="stylesheet" href="app.css">
  <script type="module" src="app.js"></script>
</head>
<body>
<main>
  <header>
    <h1>Shirohan 白版</h1>
    <p>図案から白インクの下地と色版を作り、版下を SVG で保存します。</p>
  </header>
  <form id="settings">
    <label for="art">図案（SVG・PNG・JPEG・WebP）</label>
    <input type="file" id="art" name="art" accept=".svg,image/svg+xml,image/png,image/jpeg,image/webp">
    <div class="fields">
      <div>
        <label for="width">刷り幅（mm）</label>
        <input type="number" id="width" name="width" min="20" max="600" step="1" value="260" required>
      </div>
      <div>
        <label for="choke">白版の縮み代（mm）</label>
        <input type="number" id="choke" name="choke" min="0" max="1" step="0.05" value="0.1" required>
      </div>
    </div>
    <label class="option"><input type="checkbox" name="separate"> 画像から色版も作る</label>
    <button type="submit">版を生成</button>
  </form>
  <p id="status" role="status">サンプル図案を準備しています…</p>
  <section id="result" hidden>
    <h2>版の確認</h2>
    <label for="view">プレビュー</label>
    <select id="view">
      <option value="white">白版</option>
      <option value="underbase">重なり</option>
      <option value="preview">刷り上がり</option>
    </select>
    <img id="preview" alt="選択した版のプレビュー">
    <h2>版下を保存</h2>
    <div id="films"></div>
    <section id="notices" hidden>
      <h2>製版前の確認</h2>
      <ul id="findings"></ul>
    </section>
  </section>
</main>
</body>
</html>
