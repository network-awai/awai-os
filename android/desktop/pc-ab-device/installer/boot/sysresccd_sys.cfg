INCLUDE boot/syslinux/sysresccd_head.cfg

LABEL awai-install
TEXT HELP
Install Awai OS Meiji on this PC (screen).
ENDTEXT
MENU LABEL Install Awai OS
MENU DEFAULT
LINUX boot/x86_64/vmlinuz
INITRD boot/intel_ucode.img,boot/amd_ucode.img,boot/x86_64/sysresccd.img
APPEND archisobasedir=sysresccd archisolabel=RESCUE1303 iomem=relaxed

LABEL awai-install-text
TEXT HELP
Install Awai OS Meiji on this PC (text screen).
ENDTEXT
MENU LABEL Install Awai OS (text)
LINUX boot/x86_64/vmlinuz
INITRD boot/intel_ucode.img,boot/amd_ucode.img,boot/x86_64/sysresccd.img
APPEND archisobasedir=sysresccd archisolabel=RESCUE1303 iomem=relaxed awai.installer=text

LABEL awai-install-nomodeset
TEXT HELP
Install with basic display drivers to avoid display issues.
ENDTEXT
MENU LABEL Install Awai OS (basic display, nomodeset)
LINUX boot/x86_64/vmlinuz
INITRD boot/intel_ucode.img,boot/amd_ucode.img,boot/x86_64/sysresccd.img
APPEND archisobasedir=sysresccd archisolabel=RESCUE1303 iomem=relaxed nomodeset

INCLUDE boot/syslinux/sysresccd_custom.cfg

INCLUDE boot/syslinux/sysresccd_tail.cfg
