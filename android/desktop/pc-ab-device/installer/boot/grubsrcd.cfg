# Awai OS installer boot menu (derived from the stock GRUB config of the base medium; kernel and initrd lines unchanged)

# Note: This is set when we are loaded from loopback.cfg
if [ -z "$srcd_skip_init" ]; then
	# Global options
	set timeout=5
	set default=0
	set fallback=1
	set pager=1

	# Display settings
	if loadfont /boot/grub/font.pf2 ; then
		set gfxmode=640x480
		set color_normal=black/cyan
		set color_highlight=black/light-gray
		set menu_color_normal=black/cyan
		set menu_color_highlight=black/light-gray
		insmod efi_gop
		insmod efi_uga
		insmod gfxterm
		insmod all_video
		insmod videotest
		insmod videoinfo
		echo "Switching to gfxterm"
		terminal_output gfxterm
	fi

	# enable serial console with common settings (ttyS0, 115200 Baud, 8n1)
	# this works in parallel to regular console
	serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
	terminal_input --append serial
	terminal_output --append serial
fi

if [ -z "$archiso_param" ]; then
	archiso_param="archisolabel=RESCUE1303"
fi

# Placing menuentry commands inside an eval allows the value of variables
# like $archiso_param to be visible in the GRUB editor
eval "

menuentry 'Install Awai OS' {
	set gfxpayload=keep
	linux /sysresccd/boot/x86_64/vmlinuz archisobasedir=sysresccd $archiso_param iomem=relaxed
	initrd /sysresccd/boot/intel_ucode.img /sysresccd/boot/amd_ucode.img /sysresccd/boot/x86_64/sysresccd.img
}

menuentry 'Install Awai OS (text)' {
	set gfxpayload=keep
	linux /sysresccd/boot/x86_64/vmlinuz archisobasedir=sysresccd $archiso_param iomem=relaxed awai.installer=text
	initrd /sysresccd/boot/intel_ucode.img /sysresccd/boot/amd_ucode.img /sysresccd/boot/x86_64/sysresccd.img
}

menuentry 'Install Awai OS (basic display, nomodeset)' {
	set gfxpayload=keep
	linux /sysresccd/boot/x86_64/vmlinuz archisobasedir=sysresccd $archiso_param iomem=relaxed nomodeset
	initrd /sysresccd/boot/intel_ucode.img /sysresccd/boot/amd_ucode.img /sysresccd/boot/x86_64/sysresccd.img
}

source /boot/grub/custom.cfg

menuentry 'EFI Firmware setup' {
    fwsetup
}

menuentry 'Reboot' {
    reboot
}

menuentry 'Power off' {
    halt
}

" # end eval
