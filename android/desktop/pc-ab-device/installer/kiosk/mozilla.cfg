// Awai OS installer kiosk (Firefox autoconfig, installed to <firefox dir>/mozilla.cfg). The first line must be a comment.
// Intent: the only page that can be shown is the installer, full screen, with no browser chrome. Keyboard shortcuts are
// disabled (key elements are disabled, never removed: removing them broke full screen in QEMU run 3) and swallowed in the
// capture phase, there is one tab and one window, and any other page (blocked page, new tab, about:*) is replaced by the
// installer's launch page. F5 is the recovery key: it always goes back through the launch page (fresh token fragment).
// Not verified against a real Firefox 153 ESR yet; installer/kiosk/watchdog.py restarts the browser if this fails.

var AWAI_HOME = "file:///run/awai-pc-installer/launch.html";

lockPref("browser.startup.homepage", AWAI_HOME);
lockPref("browser.startup.page", 1);
lockPref("browser.newtabpage.enabled", false);
lockPref("browser.newtab.preload", false);
lockPref("browser.aboutwelcome.enabled", false);
lockPref("browser.tabs.closeWindowWithLastTab", false);
lockPref("browser.tabs.warnOnClose", false);
lockPref("browser.tabs.warnOnCloseOtherTabs", false);
lockPref("browser.link.open_newwindow", 1);
lockPref("browser.link.open_newwindow.restriction", 0);
lockPref("browser.link.open_newwindow.override.external", 1);
lockPref("browser.search.suggest.enabled", false);
lockPref("browser.urlbar.suggest.searches", false);
lockPref("browser.shell.checkDefaultBrowser", false);
lockPref("devtools.policy.disabled", true);
lockPref("devtools.chrome.enabled", false);
lockPref("devtools.debugger.remote-enabled", false);
lockPref("extensions.pocket.enabled", false);
lockPref("browser.contentblocking.report.lockwise.enabled", false);

(function () {
  "use strict";
  var ALLOWED = /^http:\/\/127\.0\.0\.1:\d+\//;
  var CHROME_CSS = "#navigator-toolbox, #sidebar-box, #sidebar-main, #sidebar-splitter, #TabsToolbar, #nav-bar, #PersonalToolbar, " +
    "#titlebar, #global-notificationbox, #tab-notification-deck, #notification-popup-box { visibility: collapse !important; " +
    "height: 0 !important; min-height: 0 !important; max-height: 0 !important; overflow: hidden !important; }";
  var HIDE_IDS = ["navigator-toolbox", "sidebar-box", "sidebar-main", "sidebar-splitter", "global-notificationbox", "tab-notification-deck"];
  var S;
  try {
    S = Services;
  } catch (e) {
    S = Components.utils.import("resource://gre/modules/Services.jsm", {}).Services;
  }

  // A style sheet for every browser window, in case the JS hiding below is late or fails.
  try {
    var sss = Components.classes["@mozilla.org/content/style-sheet-service;1"].getService(Components.interfaces.nsIStyleSheetService);
    var uri = S.io.newURI("data:text/css;charset=utf-8," + encodeURIComponent(CHROME_CSS));
    if (!sss.sheetRegistered(uri, sss.AGENT_SHEET)) {
      sss.loadAndRegisterSheet(uri, sss.AGENT_SHEET);
    }
  } catch (e) { /* the per-window hiding still applies */ }

  function isOk(spec) {
    return spec === AWAI_HOME || ALLOWED.test(spec || "");
  }

  function goHome(win) {
    var principal = S.scriptSecurityManager.getSystemPrincipal();
    try {
      win.gBrowser.loadURI(S.io.newURI(AWAI_HOME), { triggeringPrincipal: principal });
    } catch (e) {
      win.gBrowser.selectedBrowser.loadURI(AWAI_HOME, { triggeringPrincipal: principal });
    }
  }

  function isBrowserWindow(win) {
    return win.document && win.document.documentElement && win.document.documentElement.getAttribute("windowtype") === "navigator:browser";
  }

  function hideChrome(win) {
    var doc = win.document;
    HIDE_IDS.forEach(function (id) {
      var e = doc.getElementById(id);
      if (e) {
        e.collapsed = true;
        e.style.setProperty("display", "none", "important");
      }
    });
  }

  function guard(win) {
    if (win.__awaiGuarded) {
      return;
    }
    win.__awaiGuarded = true;
    // 1. keys: disable every key element (never remove them: the full-screen code looks some of them up)
    Array.prototype.slice.call(win.document.querySelectorAll("key")).forEach(function (k) { k.setAttribute("disabled", "true"); });
    // 2. whatever is left (keys added later, content-forwarded shortcuts): swallow modified keys and function keys
    win.addEventListener("keydown", function (e) {
      if (e.key === "F5") {
        e.preventDefault();
        e.stopPropagation();
        goHome(win);
        return;
      }
      if (e.ctrlKey || e.altKey || e.metaKey || e.key === "ContextMenu" || /^F\d+$/.test(e.key)) {
        e.preventDefault();
        e.stopPropagation();
      }
    }, true);
    win.addEventListener("contextmenu", function (e) { e.preventDefault(); }, true);
    // 3. full screen, no chrome, one tab, installer pages only
    function enforce() {
      var gb = win.gBrowser;
      if (!gb) {
        return;
      }
      if (!win.fullScreen) {
        win.fullScreen = true;
      }
      hideChrome(win);
      for (var i = gb.tabs.length - 1; i > 0; i--) {
        gb.removeTab(gb.tabs[i]);
      }
      var b = gb.selectedBrowser;
      if (b.webProgress && b.webProgress.isLoadingDocument) {
        return;
      }
      // a page that has no token (storage lost) cannot talk to the backend: start again from the launch page
      if (!isOk(b.currentURI && b.currentURI.spec) || b.contentTitle === "awai-no-token") {
        goHome(win);
      }
    }
    enforce();
    win.setInterval(enforce, 500);
    if (win.gBrowser && win.gBrowser.tabContainer) {
      win.gBrowser.tabContainer.addEventListener("TabOpen", function () { win.setTimeout(enforce, 0); });
    }
  }

  function count() {
    var n = 0;
    var e = S.wm.getEnumerator("navigator:browser");
    while (e.hasMoreElements()) {
      e.getNext();
      n++;
    }
    return n;
  }

  try {
    // guard each browser window once its delayed startup has finished (full screen and the toolbars are set up by then)
    S.obs.addObserver({
      observe: function (win) {
        try {
          guard(win);
        } catch (e) { /* never break startup */ }
      }
    }, "browser-delayed-startup-finished");
    // a second window never stays
    S.obs.addObserver({
      observe: function (win) {
        win.addEventListener("load", function () {
          try {
            if (isBrowserWindow(win) && count() > 1) {
              win.close();
            }
          } catch (e) { /* ignore */ }
        }, { once: true });
      }
    }, "domwindowopened");
  } catch (e) { /* the watchdog restarts the browser if the page is not the installer */ }
})();
