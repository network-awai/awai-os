name: Otehon LAN diagnostic boot
on:
  pull_request:
    paths:
      - otehon/**
      - tests/otehon/**
      - scripts/otehon-*.mjs
      - archive/nixos/scripts/otehon-diagnostic-browser-resolver.py
      - archive/nixos/test/remote-browser-diagnostics.test.mjs
      - archive/nixos/ci/otehon-setup-screen-e2e.nix
      - archive/nixos/tests/otehon-netboot-eval.nix
      - archive/nixos/tests/otehon-installed-logs.nix
      - archive/nixos/scripts/check-otehon-lan-vm.py
      - archive/nixos/workflows/otehon-lan-diagnostic.yml
  workflow_dispatch:
    inputs:
      recover_candidate:
        description: Recover only artifacts identical to pinned successful VM proof
        required: false
        default: false
        type: boolean
      install_candidate:
        description: Validate LAN NVMe installation and build its operator-keyed candidate
        required: false
        default: false
        type: boolean
      maintenance:
        description: 'Explicit temporary operator-key-only maintenance SSH (root commands, RAM boot)'
        required: false
        default: false
        type: boolean
      diagnostic_base_artifact:
        description: 'Optional prior read-only candidate artifact ID for a small initrd delta'
        required: false
        type: string
      operator_public_key:
        description: 'Optional Ed25519 public key for a separate physical test candidate (never a private key)'
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: otehon-lan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  desktop-network-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check bounded kiosk layout and loopback network contract
        run: |
          node --test archive/nixos/test/remote-browser-diagnostics.test.mjs
          python3 -m unittest discover -s tests/otehon -p 'test_diagnostic_browser_resolver.py'
          python3 -m unittest discover -s tests/otehon -p 'test_desktop_layout.py'
          python3 -m unittest discover -s tests/otehon -p 'test_net_setup_service.py'
  setup-release-screen-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7
      - name: Build and operate the pinned release shell in an isolated browser
        run: nix-build archive/nixos/ci/otehon-setup-screen-e2e.nix --out-link result-setup-screen --show-trace
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: otehon-release-setup-screen-${{ github.sha }}
          path: result-setup-screen/
          if-no-files-found: error
  installed-journal-vm:
    if: github.event_name != 'workflow_dispatch' || (!inputs.install_candidate && !inputs.recover_candidate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7
      - name: Verify prior boot journal recovery without disk writes
        run: nix-build archive/nixos/tests/otehon-installed-logs.nix --no-out-link --show-trace
  recover-qualified-candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.recover_candidate
    uses: ./.github/workflows/otehon-lan-recover.yml
    with:
      operator_public_key: ${{ inputs.operator_public_key }}
  lan-install-candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.install_candidate && !inputs.recover_candidate
    uses: ./.github/workflows/otehon-lan-install.yml
    with:
      operator_public_key: ${{ inputs.operator_public_key }}
  lan-diagnostic-vm:
    if: github.event_name != 'workflow_dispatch' || (!inputs.install_candidate && !inputs.recover_candidate)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare space on the ephemeral runner
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7
      - name: Build with ephemeral test operator key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agent-output/lan
          ssh-keygen -q -t ed25519 -N '' -f .agent-output/lan/operator
          ssh-keygen -q -t ed25519 -N '' -f .agent-output/lan/unauthorized
          nix-instantiate --eval --strict --json --expr 'import ./tests/otehon-netboot-eval.nix { nixpkgsPath = import ./ci/nixpkgs.nix; }'
          nix-build archive/nixos/otehon/default.nix --argstr profile netboot-diagnostic-6600h --argstr diagnosticPublicKey "$(cat .agent-output/lan/operator.pub)" --out-link result-otehon-lan --show-trace
      - name: Build separately keyed physical candidate
        if: github.event_name == 'workflow_dispatch' && inputs.operator_public_key != ''
        env:
          OPERATOR_PUBLIC_KEY: ${{ inputs.operator_public_key }}
          DIAGNOSTIC_MAINTENANCE: ${{ inputs.maintenance || false }}
        shell: bash
        run: |
          set -euo pipefail
          nix-build archive/nixos/otehon/default.nix --argstr profile netboot-diagnostic-6600h --argstr diagnosticPublicKey "$OPERATOR_PUBLIC_KEY" --arg diagnosticMaintenance "$DIAGNOSTIC_MAINTENANCE" --out-link result-otehon-lan-candidate --show-trace
          mkdir -p .agent-output/lan/candidate
          for file in ipxe.efi kernel initrd installer-info.json; do cp -L "result-otehon-lan-candidate/$file" ".agent-output/lan/candidate/$file"; done
          (cd .agent-output/lan/candidate; sha256sum ipxe.efi kernel initrd installer-info.json > SHA256SUMS)
          git rev-parse HEAD > .agent-output/lan/candidate/SOURCE_REVISION
          python3 - <<'PYMETA'
          import json, os
          from pathlib import Path
          maintenance = os.environ.get('DIAGNOSTIC_MAINTENANCE') == 'true'
          marker = {'schema': 'awai.otehon.maintenance-candidate.v1' if maintenance else 'awai.otehon.diagnostic-candidate.v1', 'sourceRevision': os.environ['GITHUB_SHA'], 'profile': 'netboot-diagnostic-6600h', 'readOnly': not maintenance}
          if maintenance: marker['operatorAccess'] = 'key-only-root-shell'
          Path('.agent-output/lan/candidate/' + ('MAINTENANCE.json' if maintenance else 'DIAGNOSTIC_ONLY.json')).write_text(json.dumps(marker))
          PYMETA
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success() && github.event_name == 'workflow_dispatch' && inputs.operator_public_key != ''
        with:
          name: awai-lan-physical-candidate-unqualified
          path: .agent-output/lan/candidate/
          compression-level: 0
      - name: Prepare incremental physical diagnostic delivery
        if: github.event_name == 'workflow_dispatch' && inputs.operator_public_key != '' && inputs.diagnostic_base_artifact != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_ARTIFACT_ID: ${{ inputs.diagnostic_base_artifact }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYDELTA'
          import hashlib, json, os, re, shutil, subprocess, zipfile
          from pathlib import Path
          identifier = os.environ['BASE_ARTIFACT_ID']
          assert re.fullmatch(r'[0-9]+', identifier)
          root = Path('.agent-output/lan')
          endpoint = 'repos/network-awai/awai-os/actions/artifacts/' + identifier
          metadata = json.loads(subprocess.check_output(['gh', 'api', endpoint]))
          assert not metadata['expired'] and metadata['digest'].startswith('sha256:')
          archive = root/'base.zip'
          with archive.open('xb') as out:
              subprocess.run(['gh', 'api', endpoint+'/zip'], stdout=out, check=True)
          digest = hashlib.file_digest(archive.open('rb'), 'sha256').hexdigest()
          assert 'sha256:'+digest == metadata['digest']
          base = root/'base'; base.mkdir()
          with zipfile.ZipFile(archive) as z:
              marker = json.loads(z.read('DIAGNOSTIC_ONLY.json'))
              assert marker['profile'] == 'netboot-diagnostic-6600h' and marker['readOnly'] is True
              with z.open('initrd') as source, (base/'initrd').open('xb') as out:
                  shutil.copyfileobj(source, out, 1024*1024)
          delta = root/'delta'; delta.mkdir()
          (delta/'BASE.json').write_text(json.dumps({'artifact': int(identifier), 'archiveSha256': digest, 'initrdSha256': hashlib.file_digest((base/'initrd').open('rb'), 'sha256').hexdigest()}))
          marker_name = 'MAINTENANCE.json' if (root/'candidate/MAINTENANCE.json').exists() else 'DIAGNOSTIC_ONLY.json'
          for name in ('ipxe.efi', 'kernel', 'installer-info.json', 'SOURCE_REVISION', 'SHA256SUMS', marker_name):
              shutil.copyfile(root/'candidate'/name, delta/name)
          PYDELTA
          nix-shell --expr 'let p = import (import ./ci/nixpkgs.nix) { system = "x86_64-linux"; }; in p.mkShell { packages = [ p.xdelta ]; }' --run 'xdelta3 -e -B 134217728 -W 8388608 -s .agent-output/lan/base/initrd .agent-output/lan/candidate/initrd .agent-output/lan/delta/initrd.xdelta3'
          (cd .agent-output/lan/delta; sha256sum initrd.xdelta3 > DELTA_SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success() && github.event_name == 'workflow_dispatch' && inputs.diagnostic_base_artifact != ''
        with:
          name: awai-lan-physical-diagnostic-delta
          path: .agent-output/lan/delta/
          compression-level: 0
      - name: Boot real image and verify authenticated diagnostics
        shell: bash
        run: |
          set -euo pipefail
          nix-shell --expr 'let p = import (import ./ci/nixpkgs.nix) { system = "x86_64-linux"; }; in p.mkShell { packages = [ p.python3 p.qemu_test p.openssh ]; OVMF_CODE = "${p.OVMF.fd}/FV/OVMF_CODE.fd"; OVMF_VARS = "${p.OVMF.fd}/FV/OVMF_VARS.fd"; }' --run 'python3 archive/nixos/scripts/check-otehon-lan-vm.py --image result-otehon-lan --memory-mib 8192 --source-revision "$GITHUB_SHA" --output .agent-output/lan/proof --key .agent-output/lan/operator --bad-key .agent-output/lan/unauthorized --ovmf-code "$OVMF_CODE" --ovmf-vars "$OVMF_VARS"'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: awai-lan-diagnostic-vm-proof
          if-no-files-found: ignore
          path: |
            .agent-output/lan/proof/proof.json
            .agent-output/lan/proof/serial.log
            .agent-output/lan/proof/qemu.log
            .agent-output/lan/proof/diagnostics.json
