<!doctype html><html lang="ja"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Murakumo</title><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="awai-ui/awai-ui.css"><link rel="stylesheet" href="consent.css"><script type="module" src="app.js"></script><body>
<header><h1>Murakumo</h1><p data-i18n="context">この端末で推論</p></header>
<main class="manager">
<section aria-labelledby="models-title" class="models"><h2 id="models-title" data-i18n="models">モデル</h2><p id="recommendation" class="lead" role="status"></p><ul id="model-list" class="model-list" aria-live="polite"></ul><p id="download-status" class="label" role="status" aria-live="polite" data-role="net"></p><p class="note" data-i18n="estimateNote">推定 = ファイル + context 2048 のメモリ + 0.3 GiB。予算は RAM の 40 %。</p></section>
<section aria-labelledby="device-title" class="device"><h2 id="device-title" data-i18n="thisDevice">この端末</h2>
<div class="loaded-card"><p class="label" data-i18n="loaded">読み込み中</p><p id="loaded-model" class="loaded-name"></p><p id="loaded-detail" class="label"></p></div>
<div id="meters" class="meters"></div>
<button type="button" id="release" class="tonal" data-role="murakumo" data-i18n="release">メモリから解放</button>
</section>
<section aria-labelledby="devices-title" class="devices"><h2 id="devices-title" data-i18n="allDevices">全端末</h2><p class="label" data-i18n="allDevicesLead">各端末が署名して送った報告</p><button type="button" id="read-reports" data-role="net" class="tonal" data-i18n="readReports">報告を読む</button><p id="devices-status" class="label" role="status" aria-live="polite"></p><ul id="device-list" class="device-list"></ul></section>
<section class="generate" data-role="murakumo"><form id="generate-form" aria-labelledby="prompt-label" method="post" action="#"><h2><label id="prompt-label" for="prompt" data-i18n="prompt">何を生成しますか？</label></h2><textarea id="prompt" name="prompt" required maxlength="8192" rows="5" aria-describedby="generation-status" data-i18n-placeholder="placeholder" placeholder="短い自己紹介を日本語で書いて。"></textarea><div class="generate-actions"><button type="submit" id="generate" data-i18n="generate">生成する</button><button type="button" id="cancel" class="tonal" hidden data-i18n="stop">停止する</button><p id="generation-status" role="status" aria-live="polite"></p></div></form><h2 data-i18n="result">結果</h2><output id="result" for="prompt"></output><p class="capability" data-i18n="capability">対応：テキスト · 画像・動画エンジンは未接続</p></section>
</main>
</body></html>
