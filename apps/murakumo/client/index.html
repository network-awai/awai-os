<!doctype html><html lang="ja"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Murakumo</title><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="awai-ui/awai-ui.css"><script type="module" src="app.js"></script><body>
<header><h1>Murakumo</h1><p>この端末で推論</p></header>
<main><section aria-labelledby="model-title"><h2 id="model-title">モデル</h2><h3>Qwen3 · 0.6B</h3><p id="model-state" role="status">確認しています…</p><p>llama.cpp · この端末のみ</p><div class="model-actions"><button type="button" id="import" class="tonal">モデルを選ぶ</button><button type="button" id="load">読み込む</button><button type="button" id="release" class="tonal">メモリから解放</button></div><p class="capability">対応：テキスト<br>画像・動画エンジンは未接続</p></section>
<section><form id="generate-form" aria-labelledby="prompt-label" method="post" action="#"><h2><label id="prompt-label" for="prompt">何を生成しますか？</label></h2><textarea id="prompt" name="prompt" required maxlength="8192" rows="5" aria-describedby="generation-status" placeholder="短い自己紹介を日本語で書いて。"></textarea><div class="generate-actions"><button type="submit" id="generate">生成する</button><button type="button" id="cancel" class="tonal" hidden>停止する</button><p id="generation-status" role="status" aria-live="polite">準備しています</p></div></form><h2>結果</h2><output id="result" for="prompt">ここに生成結果が表示されます。</output></section></main>
</body></html>
