<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Bengoshi — 弁護士検索ガイド・中立ディレクトリ（準備中）</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="runtime-consent.css">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <header class="app-header">
      <div>
        <h1 id="title">Bengoshi — 弁護士検索ガイド・中立ディレクトリ（準備中）</h1>
        <p id="subtitle" class="muted"></p>
        <p id="environment" class="muted mono"></p>
      </div>
      <div class="header-meta">
        <span id="badge-zero-fee" class="badge info"></span>
        <button id="lang-toggle" type="button" class="secondary">English</button>
      </div>
    </header>

    <div id="preview-banner" class="banner warn" role="region" aria-label="プレビュー版注記">プレビュー版（架空サンプル表示）：実在する弁護士・法律事務所の掲載・登録受付・連絡取次は外部弁護士確認（O10）の完了後に開始します。</div>

    <div id="mode-bar" class="mode-bar" role="group" aria-label="View mode"></div>
    <nav id="nav" class="nav-bar"></nav>
    <details id="settings-panel" class="panel"></details>

    <p id="status" role="status" aria-live="polite"></p>
    <div id="storage-alert" class="banner danger" role="alert" hidden></div>
    <div id="view"></div>

    <footer id="footer" class="muted"></footer>
    <noscript>このアプリには JavaScript が必要です。 This app needs JavaScript.</noscript>
  </main>
</body>
</html>
