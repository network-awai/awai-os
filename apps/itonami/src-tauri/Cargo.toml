[package]
name = "itonami-app"
version = "0.1.2"
edition = "2021"
rust-version = "1.95"
[lib]
name = "itonami_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "=3.0.0-alpha.4", features = [] }
[dependencies]
tauri = { version = "=3.0.0-alpha.6", features = [] }
tauri-runtime-wry = "=3.0.0-alpha.6"
serde_json = "1"
[features]
custom-protocol = ["tauri/custom-protocol"]
