<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="text-scale" content="scale"><meta name="color-scheme" content="light dark"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src ipc: http://ipc.localhost; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Yotei</title><link rel="stylesheet" href="runtime-consent.css"><link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script></head><body><main><header><img src="calendar.svg" width="40" height="40" alt=""><h1>Yotei</h1></header><p>予定を、手元に。</p><p id="environment" class="muted"></p><button id="add" type="button" disabled>予定を追加</button><section aria-label="予定"><ul id="events"></ul><p id="empty" hidden>まだ予定はありません。</p></section><details><summary>データの保全・移行</summary><p>JSON ファイルへの書出し・読込みは、この端末内だけで行います。元のデータは自動削除しません。</p><button id="export" type="button" disabled>バックアップを書き出す</button><label for="import">バックアップを読み込む</label><input id="import" type="file" accept="application/json,.json"><button id="legacy" type="button" hidden>旧 Android 版の予定を確認</button></details><p class="muted">通知配信・外部同期は未対応です。予定はこのアプリの保存領域に保存します。</p><p id="status" role="status" aria-live="polite"></p><noscript>このアプリには JavaScript が必要です。</noscript></main></body></html>
