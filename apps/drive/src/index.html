<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="app.title">Awai Drive</title><link rel="stylesheet" href="style.css"></head><body><a class="skip" href="#files" data-i18n="app.skip">ファイル一覧へ</a><main><header><h1 data-i18n="app.title">Awai Drive</h1><p id="storage" data-i18n="storage.state">この端末 · AwaiFS 未接続</p></header><p id="status" role="status" data-i18n="status.loading">読み込んでいます…</p><nav aria-label="フォルダ" data-i18n-aria="folder.nav"><button id="back" hidden data-i18n="folder.up">上のフォルダへ</button><span id="path">この端末</span></nav><ul id="files" tabindex="-1"></ul><section class="actions" aria-label="ファイル操作" data-i18n-aria="actions.label"><button id="import" data-i18n="file.import">ファイルを追加</button><button id="folder" data-i18n="folder.create">フォルダを作成</button><button id="note" data-i18n="file.note">テキストを保存</button><button id="refresh" data-i18n="action.refresh">更新</button></section><details><summary data-i18n="storage.about">保存先について</summary><p data-i18n="storage.warning">ファイルはこのアプリ内に保存します。AwaiFS・ほかの端末への同期は未接続です。アプリの削除・Live OS の再起動では失われる場合があります。</p></details></main><dialog id="edit"><form id="entry"><h2 id="title" data-i18n="folder.create">フォルダを作成</h2><label><span data-i18n="field.name">名前</span><input id="name" maxlength="160" required autocomplete="off"></label><label id="content-label" hidden><span data-i18n="field.content">内容</span><textarea id="content" maxlength="65536"></textarea></label><p id="form-error" role="status"></p><button id="save" type="submit" data-i18n="action.save">保存</button><button id="cancel" type="button" data-i18n="action.cancel">キャンセル</button></form></dialog><script type="module" src="app.js"></script></body></html>
