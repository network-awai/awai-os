<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gyosei</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--raised:#f4f6f9;--choice:#e9edf3;--sel:#d6e3f7;--text:#1b1f24;--muted:#5a6470;--accent:#1f56a8;--on-accent:#fff;--red:#a8102e;--red-bg:#fde8ec;--border:#d5dbe3}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--raised:#1c2027;--choice:#262b33;--sel:#24344d;--text:#e8ebef;--muted:#a3acb7;--accent:#8db4f0;--on-accent:#10141a;--red:#ff9aa9;--red-bg:#3a1a20;--border:#333a44}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Noto Sans JP",system-ui,sans-serif}
#app{padding:24px;max-width:760px}
header{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
h1{font-size:22px;margin:0;font-weight:500}h3{font-size:15px;margin:0;font-weight:500}
nav{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;border-radius:6px;padding:6px 12px;background:var(--choice);color:var(--text);font:inherit;font-size:13px;cursor:pointer}
.tab.on{background:var(--sel);font-weight:600}
main{display:flex;flex-direction:column;gap:12px}
.card{background:var(--raised);border:1px solid var(--border);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;align-items:center}.wrap{flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
select,input[type=date]{font:inherit;font-size:13px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:5px 8px;min-height:32px}
.check{display:flex;gap:6px;align-items:center;font-size:13px}
button{font:inherit;font-size:13px;border:0;border-radius:6px;padding:7px 14px;background:var(--choice);color:var(--text);cursor:pointer;min-height:32px;align-self:flex-start}
button.primary{background:var(--accent);color:var(--on-accent);font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.6;cursor:default}
.muted{color:var(--muted);margin:0;font-size:13px}.small{font-size:12px}
.tag{font-size:12px;font-weight:600;border-radius:4px;padding:2px 8px;background:var(--choice);color:var(--muted)}
.tag.red{background:var(--red-bg);color:var(--red)}
.banner{margin:0;padding:8px 12px;border-radius:6px;background:var(--choice);font-size:13px}
.banner.red{background:var(--red-bg);color:var(--red)}
ul{margin:0;padding-left:20px}
@media (max-width:480px){#app{padding:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
