name: Android QA scope
on:
  pull_request:
    paths:
      - 'android/test/**'
      - '.github/workflows/android-qa-scope.yml'
      - 'scripts/ci/android-qa-scope.sh'
  push:
    branches: [main]
    paths:
      - 'android/test/**'
      - '.github/workflows/android-qa-scope.yml'
      - 'scripts/ci/android-qa-scope.sh'
permissions:
  contents: read
jobs:
  isolated-qa-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check (same script you can run locally)
        run: bash scripts/ci/android-qa-scope.sh
