name: Store update policy
on:
  pull_request:
    paths:
      - 'android/shared/src/network/awai/platform/UpdatePolicy.java'
      - 'android/tests/jvm/**'
      - 'android/tests/update-policy.sh'
      - '.github/workflows/store-update-policy.yml'
  push:
    branches: [main]
    paths:
      - 'android/shared/src/network/awai/platform/UpdatePolicy.java'
      - 'android/tests/jvm/**'
      - 'android/tests/update-policy.sh'
      - '.github/workflows/store-update-policy.yml'
permissions:
  contents: read
jobs:
  jvm-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check (same script you can run locally)
        run: bash android/tests/update-policy.sh
