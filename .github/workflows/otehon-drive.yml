name: Otehon Drive save and recovery
on:
  pull_request:
    paths:
      - otehon/drive.nix
      - otehon/drive/**
      - otehon/disk-6600h.nix
      - .github/workflows/otehon-drive.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: otehon-drive-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  drive-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7
      - name: Build and boot encrypted-state Drive VM
        shell: bash
        run: |
          mkdir -p .agent-output
          nix-build otehon/drive/check.nix --out-link result-drive-vm --keep-failed --show-trace 2>&1 | tee .agent-output/drive-vm.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: otehon-drive-vm-evidence
          path: |
            .agent-output/drive-vm.log
            result-drive-vm/
          include-hidden-files: true
