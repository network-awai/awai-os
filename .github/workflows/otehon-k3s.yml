name: Otehon K3s VM gate

on:
  pull_request:
    paths:
      - .github/workflows/otehon-k3s.yml
      - ci/nixpkgs.nix
      - otehon/k3s/**
      - otehon/desktop.nix
      - archive/nixos/tests/otehon-k3s.nix
      - archive/nixos/tests/otehon-k3s-eval.nix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k3s:
    # Independent Otehon test; no Native dependencies, secrets or fleet SSH.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7
      - name: Evaluate disabled, fleet, desktop and negative boundaries
        run: nix-instantiate --eval --strict --json --expr 'import ./tests/otehon-k3s-eval.nix { nixpkgsPath = import ./ci/nixpkgs.nix; }'
      - name: Enable isolated runner KVM
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          uname -srm
          free -m
          df -h /
      - name: Boot actual server and two agents; exercise refusal and recovery
        run: |
          set -o pipefail
          nix-build archive/nixos/tests/otehon-k3s.nix --out-link result --option cores 2 --option max-jobs 1 2>&1 | tee k3s-vm.log
          cat result/k3s-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: otehon-k3s-vm-evidence
          path: |
            k3s-vm.log
            result/k3s-evidence.json
          if-no-files-found: warn
