name: Otehon desktop HTTPS update VM
on:
  pull_request:
    paths:
      - nixos/otehon/**
      - nixos/tests/otehon-network-update.nix
      - tests/otehon-*.nix
      - tests/otehon-network-update-test.py
      - .github/workflows/otehon-network-update.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: otehon-network-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  desktop-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7
      - name: Build and boot disposable HTTPS update desktop VM
        shell: bash
        run: nix-build nixos/tests/otehon-network-update.nix --out-link result-otehon-network-update --show-trace 2>&1 | tee otehon-network-update-build.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: otehon-network-update-log
          path: |
            otehon-network-update-build.log
            result-otehon-network-update/
          if-no-files-found: ignore
