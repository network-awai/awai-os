name: Otehon desktop HTTPS update VM
on:
  pull_request:
    paths:
      - nixos/otehon/**
      - nixos/tests/otehon-network-update.nix
      - tests/otehon-*.nix
      - tests/otehon-network-update-test.py
      - .github/workflows/otehon-network-update.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7
      - name: Build and boot disposable HTTPS update desktop VM
        run: nix-build nixos/tests/otehon-network-update.nix --no-out-link --show-trace
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: otehon-network-update-log
          path: /tmp/nix-build-otehon-https-desktop-upgrade-state.drv-*/
          if-no-files-found: ignore
