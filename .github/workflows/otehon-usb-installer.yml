name: Otehon offline USB installer
on:
  pull_request:
    paths:
      - nixos/otehon/**
      - nixos/tests/otehon-usb.nix
      - tests/otehon-usb-eval.nix
      - scripts/check-otehon-usb-vm.py
      - scripts/otehon-installed-boot.py
      - .github/workflows/otehon-usb-installer.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: otehon-usb-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  usb-installer:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare capacity on this ephemeral GitHub runner
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          df -h /
          # Regenerable SDKs in this disposable runner; never runs on an owner host.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7
      - name: Evaluate and build the offline USB ISO
        id: build-iso
        shell: bash
        run: |
          mkdir -p .agent-output
          nix-instantiate --eval --strict --json --expr 'import ./tests/otehon-usb-eval.nix { nixpkgsPath = import ./ci/nixpkgs.nix; }'
          nix-build nixos/otehon/default.nix --argstr profile usb-install-6600h --out-link result-otehon-usb --show-trace 2>&1 | tee .agent-output/usb-build.log
          sha256sum result-otehon-usb/iso/*.iso | tee .agent-output/usb-sha256.txt
          git rev-parse HEAD > .agent-output/usb-source-revision.txt
      - name: Boot and exercise actual USB ISO on scratch disks
        id: vm
        shell: bash
        run: nix-build nixos/tests/otehon-usb.nix --out-link result-otehon-usb-check --keep-failed --show-trace 2>&1 | tee .agent-output/usb-vm.log
      - name: Collect bounded failed VM evidence from Nix build directory
        if: always()
        shell: bash
        run: |
          mkdir -p .agent-output/usb-vm-failure
          while IFS= read -r proof; do
            for file in result.json console.txt qemu.log screen.png; do
              if sudo test -f "$proof/$file"; then
                sudo install -o "$(id -u)" -g "$(id -g)" -m 644 "$proof/$file" ".agent-output/usb-vm-failure/$file"
              fi
            done
          done < <(sudo find /nix/var/nix/builds -type d -name proof -print 2>/dev/null)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: otehon-usb-verification
          path: |
            .agent-output/usb-*
            result-otehon-usb-check/
            /tmp/nix-build-otehon-offline-usb-vm-check.drv-*/**/proof/
          include-hidden-files: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.build-iso.outcome == 'success'
        with:
          name: awai-otehon-usb-x86_64-${{ steps.vm.outcome == 'success' && 'vm-passed' || 'unqualified-debug-only' }}
          path: result-otehon-usb/iso/*.iso
          compression-level: 0
  exact-image-installed-boot:
    name: Previously flashed ISO — installed boot diagnosis
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7
      - name: Retrieve exact previously flashed immutable image
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p .agent-output/exact-image .agent-output/exact-digests
          gh api repos/network-awai/awai-os/actions/artifacts/14045326624/zip > .agent-output/qualified.zip
          echo 'c2f2bccbdb2a364c2f0e2c565d2b9589a35e54a1a4135e7bd03c932f700aa937  .agent-output/qualified.zip' | sha256sum -c -
          unzip -j .agent-output/qualified.zip '*.iso' -d .agent-output/exact-image
          rm .agent-output/qualified.zip
          iso=$(echo .agent-output/exact-image/*.iso)
          echo "5695f3c43f97912212289b59a11b79f6662c5ebbbbb45fd4aaa0e2d2b2840133  $iso" | sha256sum -c -
          printf '%s\n' 35d1b37d8d83d0deb1d56293aaf695a36a65c841ae2449e9d012d3281bfe1032 > .agent-output/exact-digests/raw
          printf '%s\n' 27114078208 > .agent-output/exact-digests/bytes
      - name: Install, remove USB, boot, initialize state and restart
        shell: bash
        run: |
          nix-shell --expr 'let p = import (import ./ci/nixpkgs.nix) { system = "x86_64-linux"; }; in p.mkShell { packages = [ p.python3 p.qemu_test p.netpbm p.tesseract ]; OVMF_CODE = "${p.OVMF.fd}/FV/OVMF_CODE.fd"; OVMF_VARS = "${p.OVMF.fd}/FV/OVMF_VARS.fd"; }' --run 'python3 scripts/check-otehon-usb-vm.py --iso .agent-output/exact-image/*.iso --output "$PWD/.agent-output/exact-installed-proof" --ovmf-code "$OVMF_CODE" --ovmf-vars "$OVMF_VARS" --digests .agent-output/exact-digests --installed-boot' 2>&1 | tee .agent-output/exact-installed.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: exact-flashed-iso-installed-boot
          path: |
            .agent-output/exact-installed.log
            .agent-output/exact-installed-proof/*.json
            .agent-output/exact-installed-proof/*.txt
            .agent-output/exact-installed-proof/*.log
            .agent-output/exact-installed-proof/*.png
          include-hidden-files: true
          if-no-files-found: warn
