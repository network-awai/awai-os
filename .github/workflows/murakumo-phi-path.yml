name: Murakumo PHI path
# Local inference carries medical text (karute). Checks that the inference path cannot log or send it,
# that the shipped build is release-only, and that the text engine's native libraries rebuild on Linux
# to the SHA-256 pinned in apps/murakumo/native-pins.json. Every check has a negative control.
on:
  pull_request:
    paths:
      - 'apps/murakumo/**'
      - 'packages/awai-inference/**'
      - 'store/distribution/**'
      - '.github/workflows/murakumo-phi-path.yml'
  push:
    branches: [main]
    paths:
      - 'apps/murakumo/**'
      - 'packages/awai-inference/**'
      - 'store/distribution/**'
      - '.github/workflows/murakumo-phi-path.yml'
permissions:
  contents: read
jobs:
  phi-lint-and-release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: No logging, printing or network API in the inference path (with negative controls)
        run: node --test apps/murakumo/test/phi-path.test.mjs
      - name: Release-only build, APK and Store catalog checks (with negative controls)
        env:
          REQUIRE_ANDROID_SDK: '1'
        run: |
          python3 apps/murakumo/scripts/check-release.py --source
          python3 -m unittest -v apps/murakumo/test/release_check_test.py
  native-reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NDK_VERSION: 27.0.12077973
    steps:
      - uses: actions/checkout@v4
      - name: Android NDK ${{ env.NDK_VERSION }}
        run: |
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          if [ ! -f "$ndk/source.properties" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          fi
          grep "Pkg.Revision = $NDK_VERSION" "$ndk/source.properties"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - name: Rebuild the text engine from the pinned llama.cpp archive
        run: python3 apps/murakumo/scripts/build-native.py --out "$RUNNER_TEMP/native" arm64-v8a x86_64
      - name: Compare with native-pins.json (SHA-256 and forbidden imports)
        run: python3 apps/murakumo/scripts/verify-native-pins.py --dir "$RUNNER_TEMP/native"
      - name: Pin check negative controls on the rebuilt libraries
        env:
          MURAKUMO_NATIVE_DIR: ${{ runner.temp }}/native
        working-directory: apps/murakumo/test
        run: python3 -m unittest -v release_check_test.NativePins
