name: Otehon Forest guest reboot
on:
  pull_request:
    paths:
      - 'nixos/otehon/storage/**'
      - '.github/workflows/otehon-storage-reboot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guest-reboot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7
      - name: Reboot a NixOS guest and recover the Forest group
        run: nix-build nixos/otehon/storage/reboot-check.nix --no-out-link
