name: Otehon Yotei Web and Tauri v3 Nix
on:
  pull_request:
    paths:
      - apps/yotei/**
      - packages/awai-shell/**
      - android/contracts/**
      - android/client/generated/domain.js
      - nixos/otehon/shell/vendor/**
      - ci/nixpkgs.nix
      - .github/workflows/otehon-yotei.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7
      - name: Build shared Web client and verify refusal cases
        run: |
          nix-shell --expr 'let p = import (import ./ci/nixpkgs.nix) {}; in p.mkShell { packages = [ p.nodejs ]; }' --run 'node apps/yotei/scripts/build.mjs && node --test packages/awai-shell/test/*.test.mjs apps/yotei/test/*.test.mjs'
      - name: Build locked native Nix package
        run: |
          set -o pipefail
          nix-build --expr 'let p = import (import ./ci/nixpkgs.nix) {}; in p.callPackage ./apps/yotei/package.nix {}' --out-link result-yotei --option cores 2 --option max-jobs 1 2>&1 | tee yotei-nix.log
      - name: Export development closure and static Web artifact
        run: |
          mkdir -p delivery
          nix-store --query --requisites result-yotei > delivery/closure-paths.txt
          nix-store --export $(cat delivery/closure-paths.txt) | xz -T2 > delivery/yotei-x86_64-linux.nar.xz
          tar -C apps/yotei/dist -czf delivery/yotei-web.tar.gz .
          sha256sum delivery/*.xz delivery/*.gz > delivery/SHA256SUMS
          readlink -f result-yotei > delivery/store-path.txt
          printf '%s\n' "$GITHUB_SHA" > delivery/source-revision.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yotei-web-nix-development
          path: |
            delivery/
            yotei-nix.log
          if-no-files-found: warn
