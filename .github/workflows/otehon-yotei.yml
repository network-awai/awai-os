name: Otehon Yotei Web and Tauri v3 Nix
on:
  pull_request:
    paths:
      - apps/yotei/**
      - packages/awai-shell/**
      - android/contracts/**
      - android/client/generated/domain.js
      - otehon/shell/vendor/**
      - ci/nixpkgs.nix
      - .github/workflows/otehon-yotei.yml
      - scripts/ci/otehon-yotei.sh
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7
      - name: Check and export (same script you can run on a Nix host)
        run: bash scripts/ci/otehon-yotei.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yotei-web-nix-development
          path: |
            delivery/
            yotei-nix.log
          if-no-files-found: warn
